services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pdf_confirmation
      POSTGRES_PASSWORD: pdf_confirmation
      POSTGRES_USER: pdf_confirmation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdf_confirmation -d pdf_confirmation"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: builder
      args:
        NEXT_PUBLIC_APP_URL: https://confirmation.qariya.uz
        BETTER_AUTH_URL: https://confirmation.qariya.uz
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pdf_confirmation:pdf_confirmation@db:5432/pdf_confirmation?schema=public
      LOCAL_UPLOAD_DIR: /app/uploads
    command: >
      sh -c "pnpm exec prisma db push && node scripts/bootstrap-admin.mjs"
    volumes:
      - uploads:/app/uploads
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: https://confirmation.qariya.uz
        BETTER_AUTH_URL: https://confirmation.qariya.uz
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pdf_confirmation:pdf_confirmation@db:5432/pdf_confirmation?schema=public
      LOCAL_UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:3011:3000"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
